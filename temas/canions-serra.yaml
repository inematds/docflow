fatos: |
  - Itaimbezinho (Parque Nacional de Aparados da Serra, Cambará do Sul/RS e Praia Grande/SC): até setecentos metros de profundidade (Instituto Chico Mendes), cinco vírgula oito quilômetros de extensão e dois de largura; "um dos maiores cânions das Américas". Cascatas Véu de Noiva e Andorinhas caem dos paredões. Fica a dezoito quilômetros do centro de Cambará do Sul.
  - Fortaleza (Parque Nacional da Serra Geral, Cambará do Sul/RS e Jacinto Machado/SC): sete vírgula cinco quilômetros de extensão; cascata Gravata de Noivo; torre de pedra chamada Dedo de Deus. Fica a vinte e três quilômetros do centro de Cambará.
  - O Parque Nacional de Aparados da Serra foi criado em 1959; o da Serra Geral, em 1992. Os dois juntos têm cerca de trinta mil hectares.
  - Região: a maior concentração de cânions do Brasil, com cerca de duzentos e cinquenta quilômetros de escarpas (Serviço Geológico do Brasil). Desníveis de até mil metros a menos de cinquenta quilômetros do mar.
  - Geoparque Mundial da UNESCO Caminhos dos Cânions do Sul, reconhecido em 2022: sete municípios, três no RS e quatro em SC.
  - Origem: derrames de lava de mais de cem milhões de anos, quando o antigo continente Gondwana se partiu e nasceu o oceano Atlântico. O Itaimbezinho é considerado um dos melhores registros dessa ruptura (UNESCO).
  - Neblina: os moradores chamam de "viração" o nevoeiro que se forma rápido e enche o cânion. Não dá para prever; a chance de ver o cânion limpo é maior de manhã cedo.
  - Frio: Cambará do Sul fica sempre entre os lugares mais frios do Brasil; há geada, e a região é um dos poucos lugares do país com registro de neve.
  - Trilha do Vértice: cerca de um quilômetro e meio ida e volta, uns quarenta e cinco minutos, até o mirante das cachoeiras. Trilha do Cotovelo: cerca de seis quilômetros ida e volta, umas três horas, entre araucárias e campos. Nas trilhas da borda, guia não é obrigatório.
  - Trilha do Rio do Boi: por baixo do Itaimbezinho, saindo de Praia Grande; cerca de catorze quilômetros ida e volta, sete a oito horas dentro do leito do rio; condutor credenciado obrigatório e idade mínima de doze anos; fecha em dia de chuva.
  - Parques abertos das oito às dezessete horas; ingresso comprado antes, pela internet, no site da concessionária Urbia Cânions Verdes; confira os dias de fechamento no site.
  - Cavalgada: em Praia Grande há passeios a cavalo pelas antigas rotas dos tropeiros (Geoparque). Pousadas com cavalgada, segundo o site de cada uma: Parador Cambará do Sul e Pousada Corucacas (Cambará do Sul/RS); Pousada Aparados da Serra (São José dos Ausentes/RS); Morada dos Canyons (Praia Grande/SC, com operadores parceiros); Rio do Rastro Eco Resort e Hotel Fazenda Rota dos Cânions (Bom Jardim da Serra/SC).
  - Caminhada e trilhas, segundo o site de cada uma: Recanto dos Canyons e Discovery Canyon (Praia Grande/SC, passeios com agência/operadores parceiros); Aldeia Colibri (Jaquirana/RS, trilhas com cachoeira); Pousada Fazenda Pedra Preta (Urubici/SC, trilhas na mata de araucária).
  - Mais da serra: a Serra do Rio do Rastro sobe de duzentos a mil e quatrocentos metros de altitude em dezessete quilômetros de curvas; no Morro da Igreja, em Urubici, o vale vira um mar de nuvens e há a Pedra Furada.
  - Endereços para pesquisar: canionsverdes.com.br (parques e ingressos); canionsdosul.org (geoparque); site do Instituto Chico Mendes em gov.br (parques nacionais); turismo.rs.gov.br; prefeituras de Praia Grande e Urubici. Os links completos estão na descrição.

estrutura: |
  1. Gancho: paredões de até setecentos metros, no Sul do Brasil, onde a serra despenca em cânions até quase o mar. Nenhum capítulo.
  2. Onde fica: divisa do RS com SC, Cambará do Sul em cima, Praia Grande embaixo (mapa m-onde).
  3. capitulo "Os cânions": Itaimbezinho, setecentos metros, cascatas.
  4. Fortaleza, sete vírgula cinco quilômetros, o Dedo de Deus e a viração (neblina).
  5. A maior concentração de cânions do Brasil e o geoparque da UNESCO (mapa m-serra).
  6. Origem: lava de mais de cem milhões de anos, Gondwana se partindo, nasce o Atlântico.
  7. capitulo "As trilhas": Vértice e Cotovelo, pela borda.
  8. Rio do Boi: o cânion visto de baixo, com condutor.
  9. capitulo "A cavalo": cavalgadas pelos campos de cima da serra e rotas dos tropeiros.
  10. Pousadas com cavalgada (mapa m-pousadas).
  11. Pousadas com cavalgada: os nomes (quadro l-cavalgada).
  12. Pousadas com caminhada e trilhas (quadro l-caminhada).
  13. capitulo "Mais da serra": Serra do Rio do Rastro, Morro da Igreja, frio, geada e neve.
  14. Dicas: vá cedo por causa da neblina, compre o ingresso antes, leve agasalho.
  15. capitulo "Para pesquisar": os endereços (quadro l-enderecos), diz que os links estão na descrição.

